## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.5.3'
  # Wi-Fi via the on-board ESP32-C5 coprocessor (ESP-Hosted over SDIO)
  espressif/esp_wifi_remote:
    version: "1.6.2"
  espressif/esp_hosted:
    version: "~2.13.0"

  espressif/esp-brookesia:
    version: 0.4.*

  esp_video:
    version: 2.0.*
    public: true

  espressif/esp_lvgl_adapter:
    version: 0.5.*
    public: true
  waveshare/esp32_p4_platform:
    version: '*'
    override_path: "../components/waveshare__esp32_p4_platform"
